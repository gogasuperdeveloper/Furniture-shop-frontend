<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FurniGoga</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        color: #333;
      }
      .product {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .product h3 {
        margin: 0 0 8px;
      }
      .product p {
        margin: 4px 0;
        color: #555;
      }
      .price {
        font-weight: bold;
        color: #222;
        font-size: 18px;
      }
      #error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>FurniGoga — Каталог товарів</h1>
    <p id="error"></p>
    <div id="products"></div>

    <script>
      $.ajax({
        url: "http://127.0.0.1:8000/api/v1/products",
        method: "GET",
        success: function (data) {
          if (data.length === 0) {
            $("#products").html("<p>Товарів поки немає.</p>");
            return;
          }
          data.forEach(function (product) {
            $("#products").append(
              '<div class="product">' +
                "<h3>" +
                product.name +
                "</h3>" +
                '<p class="price">' +
                product.price +
                " грн</p>" +
                "<p>" +
                product.description +
                "</p>" +
                "<p>Матеріал: " +
                (product.material || "—") +
                "</p>" +
                "<p>Колір: " +
                (product.color || "—") +
                "</p>" +
                "<p>В наявності: " +
                product.stock_quantity +
                " шт.</p>" +
                "</div>"
            );
          });
        },
        error: function () {
          $("#error").text(
            "Помилка завантаження даних. Перевірте, чи запущений бекенд."
          );
        },
      });
    </script>
  </body>
</html>
