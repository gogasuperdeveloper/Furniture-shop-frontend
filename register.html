<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FurniGoga — Реєстрація</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
    input { width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    #error { color: red; margin-bottom: 12px; }
    #success { color: green; margin-bottom: 12px; }
    a { display: block; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <h2>Реєстрація</h2>
  <p id="error"></p>
  <p id="success"></p>
  <input type="text" id="username" placeholder="Username" />
  <input type="text" id="first_name" placeholder="Ім'я (необов'язково)" />
  <input type="text" id="last_name" placeholder="Прізвище (необов'язково)" />
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="password" placeholder="Пароль (мін. 8 символів)" />
  <input type="password" id="password_confirmation" placeholder="Повторіть пароль" />
  <button onclick="register()">Зареєструватись</button>
  <a href="login.html">Вже є акаунт? Увійти</a>

  <script>
    const API = "http://127.0.0.1:8000/api/v1";

    if (localStorage.getItem("access_token")) {
      window.location.href = "index.html";
    }

    function register() {
      const body = {
        username: document.getElementById("username").value,
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        password_confirmation: document.getElementById("password_confirmation").value,
      };

      fetch(API + "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      })
      .then(res => res.json().then(data => ({ ok: res.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) {
          const errors = data.error;
          const msg = Object.values(errors).flat().join(" ");
          document.getElementById("error").textContent = msg;
          document.getElementById("success").textContent = "";
          return;
        }
        document.getElementById("error").textContent = "";
        document.getElementById("success").textContent = "Реєстрація успішна! Зараз перенаправимо на вхід...";
        setTimeout(() => { window.location.href = "login.html"; }, 1500);
      })
      .catch(() => {
        document.getElementById("error").textContent = "Помилка з'єднання з сервером";
      });
    }
  </script>
</body>
</html>
